<div class="container px-4 py-8 mx-auto">
  <!-- Título dinámico -->
  <h1 class="section-title" *ngIf="isCreate">Registrar Item</h1>
  <h1 class="section-title" *ngIf="isEdit">Editar Item</h1>
  <h1 class="section-title" *ngIf="isReadOnly">Detalles del Item</h1>

  <div class="bg-white rounded-2xl p-10 shadow-sm">
    <!-- Componente de subida de imagen -->
    <app-upload-image
      [imageSrc]="uploadedImageFile ? 'data:image/jpeg;base64,' + uploadedImageFile : null"
      [readonly]="isReadOnly"
      (imageUploaded)="onImageUploaded($event)"
    >
    </app-upload-image>

    <!-- Formulario -->
    <form class="mt-8" (ngSubmit)="saveItem()" #itemForm="ngForm">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <!-- Campo Nombre -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"> Nombre <span class="text-red-500" *ngIf="!isReadOnly">*</span> </label>
          <input
            class="block border placeholder-[#9aa0a6] border-[#e1e1e1] bg-[#f8f9fa] w-full p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-[#4880FF] focus:border-transparent disabled:bg-gray-100 disabled:cursor-not-allowed"
            type="text"
            placeholder="Nombre del item"
            [(ngModel)]="nombre"
            name="nombre"
            [readonly]="isReadOnly"
            [disabled]="isReadOnly"
            (input)="clearMessages()"
            required
          />
        </div>

        <!-- Campo Marca -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"> Marca <span class="text-red-500" *ngIf="!isReadOnly">*</span> </label>
          <input
            class="block border placeholder-[#9aa0a6] border-[#e1e1e1] bg-[#f8f9fa] w-full p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-[#4880FF] focus:border-transparent disabled:bg-gray-100 disabled:cursor-not-allowed"
            type="text"
            placeholder="Marca del item"
            [(ngModel)]="marca"
            name="marca"
            [readonly]="isReadOnly"
            [disabled]="isReadOnly"
            (input)="clearMessages()"
            required
          />
        </div>

        <!-- Campo Descripción -->
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2"> Descripción <span class="text-red-500" *ngIf="!isReadOnly">*</span> </label>
          <textarea
            class="block border placeholder-[#9aa0a6] border-[#e1e1e1] bg-[#f8f9fa] w-full p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-[#4880FF] focus:border-transparent disabled:bg-gray-100 disabled:cursor-not-allowed resize-none"
            placeholder="Descripción detallada del item"
            rows="4"
            [(ngModel)]="descripcion"
            name="descripcion"
            [readonly]="isReadOnly"
            [disabled]="isReadOnly"
            (input)="clearMessages()"
            required
          ></textarea>
        </div>
      </div>

      <!-- Sección de botones y mensajes -->
      <section class="flex flex-col gap-4 items-center mt-8">
        <!-- Botón de guardar (solo visible si no es modo view) -->
        <div *ngIf="!isReadOnly" class="mt-4">
          <button
            type="submit"
            class="bg-[#4880FF] rounded-md px-8 py-3 text-white font-medium hover:bg-blue-600 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2"
            [disabled]="!canSubmit"
          >
            <!-- Spinner de carga -->
            <span *ngIf="isSubmitting" class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>

            <!-- Icono de guardado cuando no está enviando -->
            <svg *ngIf="!isSubmitting" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>

            {{ buttonText }}
          </button>
        </div>

        <!-- Mensajes de error -->
        <div *ngIf="errorMessage" class="mt-4 p-4 bg-red-50 border border-red-200 text-red-800 rounded-md w-full max-w-md text-center">
          <div class="flex items-center justify-center gap-2">
            <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            {{ errorMessage }}
          </div>
        </div>

        <!-- Mensaje de éxito -->
        <div *ngIf="successMessage" class="mt-4 p-4 bg-green-50 border border-green-200 text-green-800 rounded-md w-full max-w-md text-center">
          <div class="flex items-center justify-center gap-2">
            <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            {{ successMessage }}
          </div>
        </div>

        <!-- Botón de volver (solo en modo view) -->
        <div *ngIf="isReadOnly" class="mt-4">
          <button
            type="button"
            class="bg-gray-500 rounded-md px-8 py-3 text-white font-medium hover:bg-gray-600 transition-colors flex items-center gap-2"
            (click)="navigateToInventory()"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Volver al Inventario
          </button>
        </div>
      </section>
    </form>
  </div>
</div>
