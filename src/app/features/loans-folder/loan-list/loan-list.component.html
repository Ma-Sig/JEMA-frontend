<div class="flex justify-between items-start pt-12 pr-8">
  <h1 class="section-title">Prestamos</h1>
  <button [routerLink]="['/loans/new']" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Nuevo</button>
</div>

<div class="w-full mx-auto px-4 mt-4">
  <div class="w-full justify-center">
    <app-table
      class="w-full"
      [data]="inventoryData"
      [columns]="inventoryColumns"
      [showActions]="true"
      (view)="onViewItem($event)"
      (edit)="onEditItem($event)"
      (delete)="onDeleteItem($event)"
    ></app-table>
  </div>
</div>
