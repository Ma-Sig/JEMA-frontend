<div class="page-container flex flex-col md:flex-row">
  <div class="content-area flex-1 p-4 sm:p-6">
    <div class="flex flex-col items-center gap-6">
      <!-- Autocomplete search -->
      <div *ngIf="selectedItem === 'Historico de Item'" class="w-full max-w-md px-2 sm:px-0">
        <input
          type="text"
          placeholder="Buscar ítem por código o nombre"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchTermChange($event)"
          class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <ul *ngIf="filteredItems.length > 0" class="border rounded bg-white shadow mt-1">
          <li *ngFor="let item of filteredItems" class="px-4 py-2 hover:bg-gray-200 cursor-pointer" (click)="onSelectItem(item)">
            {{ item.codigo }} - {{ item.nombre }}
          </li>
        </ul>
      </div>

      <!-- Fechas solo si es Histórico -->
      <div *ngIf="selectedItem === 'Historico de Item'" class="calendar-container flex flex-col md:flex-row gap-6 items-center w-full justify-center">
        <div class="flex flex-col items-center">
          <p class="text-gray-600 mb-2">Fecha inicio</p>
          <app-calendar [(ngModel)]="fechaInicio"></app-calendar>
        </div>
        <div class="flex flex-col items-center">
          <p class="text-gray-600 mb-2">Fecha fin</p>
          <app-calendar [(ngModel)]="fechaFin"></app-calendar>
        </div>
      </div>

      <!-- Dropdowns solo para Item por lugar -->
      <div *ngIf="selectedItem === 'Item por lugar'" class="flex flex-col md:flex-row gap-4 items-center w-full justify-center">
        <div class="flex flex-col">
          <label class="text-sm font-medium text-gray-700">Lugar:</label>
          <select [(ngModel)]="selectedLugar" (change)="onLugarSeleccionado(selectedLugar)" class="px-4 py-2 border rounded">
            <option *ngFor="let lugar of lugares" [ngValue]="lugar">{{ lugar }}</option>
          </select>
        </div>
        <div class="flex flex-col">
          <label class="text-sm font-medium text-gray-700">Item:</label>
          <select [(ngModel)]="selectedItemLugar" class="px-4 py-2 border rounded shadow-sm w-full max-w-xs">
            <option *ngFor="let item of itemsPorLugar" [value]="item">{{ item }}</option>
          </select>
        </div>
      </div>

      <div *ngIf="selectedItem" class="text-center">
        <h2 class="text-xl font-semibold text-gray-800">{{ selectedItem }}</h2>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md justify-center items-center">
        <div class="w-full sm:w-40 h-12">
          <app-button class="w-full h-full" label="Mostrar reporte" (clicked)="onMostrarReporte()"></app-button>
        </div>
        <div class="w-full sm:w-40 h-12">
          <app-button class="w-full h-full" label="Guardar reporte" (clicked)="onGuardarReporte()"></app-button>
        </div>
      </div>
    </div>

    <div class="mt-8 overflow-x-auto">
      <app-table *ngIf="showTable" [columns]="tableColumns" [data]="tableData" [showActions]="false" class="min-w-full"></app-table>
    </div>
  </div>

  <div class="sidebar w-full md:w-64 bg-gray-100 border-t md:border-t-0 md:border-l border-gray-200 p-4">
    <div
      class="sidebar-item px-4 py-2 rounded cursor-pointer hover:bg-blue-100"
      *ngFor="let item of items"
      [class.bg-blue-200]="item === selectedItem"
      (click)="seleccionarItem(item)"
    >
      {{ item }}
    </div>
  </div>
</div>
