<div class="container p-4">
  <h2 class="text-xl font-bold mb-4">Reportes</h2>

  <!-- Selector principal -->
  <div class="mb-4">
    <label class="block mb-1 font-semibold">Selecciona un reporte:</label>
    <select [(ngModel)]="selectedItem" (change)="seleccionarItem(selectedItem)" class="border rounded px-3 py-2 w-full max-w-xs">
      <option [ngValue]="null">-- Selecciona una opción --</option>
      <option *ngFor="let item of items" [ngValue]="item">{{ item }}</option>
    </select>
  </div>

  <!-- Historico de Item -->
  <div *ngIf="selectedItem === 'Historico de Item'" class="mb-6">
    <label class="block mb-1 font-semibold">Selecciona un ítem:</label>
    <select [(ngModel)]="selectedComboItem" class="border rounded px-3 py-2 w-full max-w-xs">
      <option [ngValue]="null">-- Selecciona un ítem --</option>
      <option *ngFor="let item of comboItems" [ngValue]="item">{{ item.nombre }}</option>
    </select>
  </div>

  <!-- Item por lugar -->
  <div *ngIf="selectedItem === 'Item por lugar'" class="mb-6">
    <label class="block mb-1 font-semibold">Selecciona un lugar:</label>
    <select [(ngModel)]="selectedLugar" (change)="onLugarSeleccionado()" class="border rounded px-3 py-2 w-full max-w-xs">
      <option [ngValue]="null">-- Selecciona un lugar --</option>
      <option *ngFor="let lugar of lugares" [ngValue]="lugar">{{ lugar.nombre }}</option>
    </select>
  </div>

  <!-- Botón mostrar reporte -->
  <button (click)="onMostrarReporte()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700" [disabled]="!selectedItem">
    Mostrar reporte
  </button>

  <!-- Mensaje de información -->
  <div *ngIf="mensajeInfo" class="mt-6 text-center text-gray-700 font-medium">
    {{ mensajeInfo }}
  </div>

  <!-- Tabla de resultados -->
  <div *ngIf="showTable" class="mt-8 overflow-x-auto max-w-full">
    <table class="min-w-full border border-gray-300">
      <thead class="bg-gray-200">
        <tr>
          <th *ngFor="let col of tableColumns" class="border border-gray-300 px-4 py-2 text-left">
            {{ col.label }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of tableData" class="hover:bg-gray-100">
          <td *ngFor="let col of tableColumns" class="border border-gray-300 px-4 py-2">
            {{ row[col.key] }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón guardar reporte -->
  <div *ngIf="showTable" class="mt-4">
    <button (click)="onGuardarReporte()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Guardar reporte
    </button>
  </div>
</div>
