<div *ngIf="isOpen" class="fixed inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center z-50 py-4 px-4">
  <div class="bg-white rounded-2xl p-4 mx-8 w-full">
    <div class="grid grid-cols-12 gap-4">
      <div class="space-y-2 col-span-6">
        <label class="field-title">Nombre del servicio</label>
        <div class="grid grid-cols-12 gap-2 items-center">
          <div class="col-span-12">
            <app-input-field [placeholder]="'Nombre del servicio'" (valueChange)="onServiceNameChange($event)"></app-input-field>
          </div>
        </div>
      </div>

      <div class="space-y-2 col-span-6">
        <label class="field-title">Unidad</label>
        <div class="grid grid-cols-12 gap-2 items-center">
          <div class="col-span-12">
            <app-input-field [placeholder]="'Unidad'" (valueChange)="onUnitOfMeasureChange($event)"></app-input-field>
          </div>
        </div>
      </div>

      <div class="space-y-2 col-span-6">
        <label class="field-title">Precio</label>
        <div class="grid grid-cols-12 gap-2 items-center">
          <div class="col-span-12">
            <app-input-field [placeholder]="'Precio'" [regexExp]="priceRegex" (valueChange)="onPriceChange($event)"></app-input-field>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-4 flex justify-center">
      <div class="w-3xs h-10">
        <app-button class="w-full h-full" [label]="'Guardar'" (clicked)="close()"> </app-button>
      </div>
    </div>
  </div>
</div>
