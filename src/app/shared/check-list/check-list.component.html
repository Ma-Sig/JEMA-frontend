<div class="selectable-list-container w-full">
  <ul class="selectable-list w-full">
    <li *ngFor="let option of options" class="list-item" [class.selected]="option.selected" (click)="toggleItem(option)">
      <div class="checkbox-container" (click)="$event.stopPropagation()">
        <input type="checkbox" class="checkbox" [(ngModel)]="option.selected" (click)="$event.stopPropagation()" />
      </div>
      <span class="item-text">{{ propertyName === '' ? option : option[propertyName] }}</span>
    </li>
  </ul>

  <div class="actions-container" hidden>
    <div class="selection-info">
      {{ selectedCount }} elemento{{ selectedCount !== 1 ? 's' : '' }} seleccionado{{ selectedCount !== 1 ? 's' : '' }}
    </div>
    <div class="action-buttons hidden">
      <button class="action-button select-all-button" (click)="toggleAll()">
        {{ allSelected ? 'Deseleccionar todos' : 'Seleccionar todos' }}
      </button>
      <button class="action-button primary-button" [disabled]="selectedCount === 0" (click)="performAction()">Continuar</button>
    </div>
  </div>
</div>
