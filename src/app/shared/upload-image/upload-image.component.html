<div class="upload-container">
    <label class="upload-button" for="photoUpload">
      <div class="upload-circle">
        <img *ngIf="imageSrc" [src]="imageSrc" class="preview-image" />
        <svg *ngIf="!imageSrc" class="camera-icon" width="32" height="32" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
  
        <div *ngIf="imageSrc" class="remove-button" (click)="removeImage($event)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      </div>
      <span class="upload-text">Subir Foto</span>
    </label>
    <input type="file" id="photoUpload" class="upload-input" accept="image/*" (change)="onFileSelected($event)">
  </div>
