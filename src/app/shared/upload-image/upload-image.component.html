<div class="upload-container h-full relative">
  <label class="upload-button h-full w-full block" for="photoUpload">
    <div class="upload-circle h-full w-40 relative overflow-hidden">
      <img *ngIf="imageSrc" [src]="imageSrc" class="preview-image h-full w-full object-cover rounded-md" />

      <svg
        *ngIf="!imageSrc"
        class="camera-icon mx-auto my-auto text-gray-500"
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </div>
  </label>

  <button
    *ngIf="imageSrc"
    (click)="removeImage($event)"
    class="absolute top-2 right-2 bg-white text-red-600 rounded-full p-2 shadow-lg hover:bg-gray-100 z-10"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <input type="file" id="photoUpload" class="upload-input hidden" accept="image/*" (change)="onFileSelected($event)" />
</div>
