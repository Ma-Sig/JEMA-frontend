<div class="textarea-group">
  <textarea
    class="textarea-field"
    [ngClass]="{
      'is-valid': isValid === true,
      'is-invalid': isValid === false
    }"
    [placeholder]="placeholder"
    [(ngModel)]="value"
    (input)="onInputChange()"
    (blur)="validate()"
  ></textarea>

  <div
    class="validation-message"
    [ngClass]="{
      success: isValid === true,
      error: isValid === false
    }"
    *ngIf="validationMessage"
  >
    {{ validationMessage }}
  </div>
</div>
