<!-- Botón flotante para abrir/cerrar el chat -->
<button
  (click)="toggleChat()"
  class="fixed bottom-4 right-4 bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-lg transition-all duration-300 z-50 md:bottom-6 md:right-6"
  [class]="{ hidden: isOpen, 'md:block': isOpen, 'rotate-45': isOpen }"
>
  <svg
    class="w-6 h-6 transition-transform duration-300"
    [class.hidden]="isOpen"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
    ></path>
  </svg>
  <svg
    class="w-6 h-6 transition-transform duration-300"
    [class.hidden]="!isOpen"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
  </svg>
</button>

<!-- Ventana del chat -->
<div
  class="fixed inset-0 bg-white shadow-2xl transform transition-transform duration-300 z-40 md:inset-auto md:bottom-25 md:w-96 md:h-1/2 md:rounded-lg"
  [class]="{
    'md:right-7': isOpen,
    'md:right-0': !isOpen,
    'translate-y-full': !isOpen,
    'md:translate-y-0': !isOpen,
    'md:translate-x-full': !isOpen,
    'md:scale-95': !isOpen
  }"
>
  <!-- Header del chat -->
  <div class="bg-blue-600 text-white p-4 flex items-center justify-between md:rounded-t-lg">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"
          ></path>
        </svg>
      </div>
      <div>
        <h3 class="font-semibold">Asistente Virtual</h3>
        <p class="text-xs text-blue-100">En línea</p>
      </div>
    </div>
    <button (click)="toggleChat()" class="text-blue-100 hover:text-white transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Área de mensajes -->
  <div class="flex-1 p-4 space-y-4 overflow-y-auto bg-gray-50" style="height: calc(100% - 140px)">
    <!-- Mensaje del bot -->
    <div class="flex items-start space-x-2">
      <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"
          ></path>
        </svg>
      </div>
      <div class="bg-white p-3 rounded-lg shadow-sm max-w-xs">
        <p class="text-sm text-gray-800">¡Hola! ¿En qué puedo ayudarte hoy?</p>
        <span class="text-xs text-gray-500 mt-1 block">10:30 AM</span>
      </div>
    </div>

    <!-- Mensaje del usuario -->
    <div class="flex items-start space-x-2 justify-end">
      <div class="bg-blue-600 text-white p-3 rounded-lg shadow-sm max-w-xs">
        <p class="text-sm">Hola, necesito ayuda con mi pedido</p>
        <span class="text-xs text-blue-100 mt-1 block">10:32 AM</span>
      </div>
      <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
        </svg>
      </div>
    </div>

    <!-- Mensaje del bot con opciones -->
    <div class="flex items-start space-x-2">
      <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"
          ></path>
        </svg>
      </div>
      <div class="space-y-2">
        <div class="bg-white p-3 rounded-lg shadow-sm max-w-xs">
          <p class="text-sm text-gray-800">Claro, puedo ayudarte con tu pedido. ¿Qué necesitas saber?</p>
          <span class="text-xs text-gray-500 mt-1 block">10:33 AM</span>
        </div>
        <div class="space-y-1">
          <button class="block w-full text-left p-2 text-sm bg-blue-50 hover:bg-blue-100 rounded-lg border border-blue-200 transition-colors">
            Estado del pedido
          </button>
          <button class="block w-full text-left p-2 text-sm bg-blue-50 hover:bg-blue-100 rounded-lg border border-blue-200 transition-colors">
            Modificar pedido
          </button>
          <button class="block w-full text-left p-2 text-sm bg-blue-50 hover:bg-blue-100 rounded-lg border border-blue-200 transition-colors">
            Cancelar pedido
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Input para escribir mensajes -->
  <div class="p-4 border-t bg-white md:rounded-b-lg">
    <div class="flex space-x-2">
      <input
        type="text"
        placeholder="Escribe tu mensaje..."
        class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        [(ngModel)]="messageText"
        (keyup.enter)="sendMessage()"
      />
      <button
        (click)="sendMessage()"
        class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg transition-colors flex items-center justify-center"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
