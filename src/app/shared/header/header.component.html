<!-- Header -->
<header class="header">
  <button class="menu-button" (click)="openSidebar()" aria-label="Abrir menú">
    <!-- Icono de menú -->
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="logo"><span class="logo-blue">JE</span><span class="logo-black">MA</span></div>

  <div class="right-icons">
    <div class="notification-container">
      <!-- Icono de campana -->
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-badge">1</span>
    </div>

    <div class="user-container">
      <div class="user-icon" (click)="toggleUserDropdown($event)">
        <!-- Icono de usuario -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <!-- Dropdown de usuario -->
      <div class="user-dropdown" [class.active]="dropdownOpen" (click)="$event.stopPropagation()">
        <div class="user-dropdown-header">
          <div class="user-dropdown-name">Usuario JEMA</div>
          <div class="user-dropdown-email">usuario&#64;jema.com</div>
        </div>
        <div class="user-dropdown-menu">
          <div class="user-dropdown-item">Mi perfil</div>
          <div class="user-dropdown-item">Seguridad</div>
          <div class="user-dropdown-item">Configuración</div>
          <div class="user-dropdown-divider"></div>
          <div class="user-dropdown-item">Cerrar sesión</div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Sidebar -->
<div class="sidebar" [class.open]="sidebarOpen">
  <div class="sidebar-header">
    <div class="logo"><span class="logo-blue">JE</span><span class="logo-black">MA</span></div>
    <button class="close-button" (click)="closeSidebar()" aria-label="Cerrar menú">
      <!-- Icono de cerrar -->
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <nav class="sidebar-nav">
    <ul>
      <li><a href="#">Inicio</a></li>
      <li>
        <a [routerLink]="['/inventory/items']" (click)="closeSidebar()">Items</a>
      </li>
      <li><a href="#">Consumos de servicios</a></li>
      <li><a href="#">Inventario</a></li>
      <li><a href="/auth/reports">Reportes</a></li>
      <li><a href="/auth/info-page">Sobre nosotros</a></li>
      <li><a href="#">Mensajes</a></li>
      <li><a href="#">Cerrar sesión</a></li>
    </ul>
  </nav>
</div>

<!-- Overlay -->
<div class="overlay" [class.active]="sidebarOpen" (click)="closeSidebar()"></div>
