<!-- Header -->
<header class="flex items-center justify-between px-4 py-3 border border-[#e5e5e5] shadow-sm bg-white">
  <button class="bg-none border-none p-2 cursor-pointer rounded-sm hover:bg-[#f5f5f5]" (click)="openSidebar()" aria-label="Abrir menú">
    <!-- Icono de menú -->
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="font-bold text-xl cursor-pointer" routerLink="/"><span class="text-accent">JE</span><span class="text-black">MA</span></div>

  <div class="flex items-center gap-4 cursor-pointer">
    <div class="relative">
      <!-- Icono de campana -->
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="absolute -top-1 -right-1 bg-[#ef4444] text-white text-xs w-4 h-4 rounded-full flex items-center justify-center">1</span>
    </div>

    <div class="relative">
      <div class="bg-[#e5e5e5] rounded-full p-1 cursor-pointer hover:bg-[#d5d5d5]" (click)="toggleUserDropdown($event)">
        <!-- Icono de usuario -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <!-- Dropdown de usuario -->
      <div
        class="absolute top-full right-0 w-52 bg-white rounded-sm shadow-md/5 mt-2 z-100"
        [class]="{ hidden: !dropdownOpen, block: dropdownOpen, 'animate-fade-in': dropdownOpen }"
        (click)="$event.stopPropagation()"
      >
        <div class="px-4 py-3 border border-[#e5e5e5]">
          <div class="font-bold mb-1">Usuario JEMA</div>
          <div class="text-xs text-[#666666]">usuario&#64;jema.com</div>
        </div>
        <div class="py-2">
          <div class="py-2 px-4 flex items-center gap-2 cursor-pointer transition-colors duration-200 hover:bg-[#f5f5f5]">Mi perfil</div>
          <div class="py-2 px-4 flex items-center gap-2 cursor-pointer transition-colors duration-200 hover:bg-[#f5f5f5]">Seguridad</div>
          <div class="py-2 px-4 flex items-center gap-2 cursor-pointer transition-colors duration-200 hover:bg-[#f5f5f5]">Configuración</div>
          <div class="h-0.5 bg-[#e5e5e5] mx-2 my-0"></div>
          <div class="py-2 px-4 flex items-center gap-2 cursor-pointer transition-colors duration-200 hover:bg-[#f5f5f5]">Cerrar sesión</div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Sidebar -->
<div
  class="fixed top-0 -left-64 w-64 h-full bg-white shadow-md z-1000 transition-transform ease-in-out duration-300"
  [class.translate-x-full]="sidebarOpen"
>
  <div class="flex justify-between items-center p-4 border border-[#e5e5e5]">
    <div class="logo"><span class="logo-blue">JE</span><span class="logo-black">MA</span></div>
    <button class="bg-none border-none cursor-pointer p-1 rounded-s hover:bg-[#f5f5f5]" (click)="closeSidebar()" aria-label="Cerrar menú">
      <!-- Icono de cerrar -->
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <nav class="p-4">
    <ul class="list-none">
      <li class="mb-2"><a class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]" href="/">Inicio</a></li>
      <li class="mb-2">
        <a class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]" [routerLink]="['/inventory/items']" (click)="closeSidebar()"
          >Items</a
        >
      </li>
      <li class="mb-2">
        <a
          class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]"
          [routerLink]="['/service-consumption/list']"
          (click)="closeSidebar()"
          >Consumos de servicios</a
        >
      </li>
      <li class="mb-2">
        <a
          class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]"
          [routerLink]="['/inventory/inventories']"
          (click)="closeSidebar()"
          >Inventario</a
        >
      </li>
      <li class="mb-2">
        <a class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]" [routerLink]="['/reports']" (click)="closeSidebar()"
          >Reportes</a
        >
      </li>
      <li class="mb-2">
        <a class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]" [routerLink]="['/info']" (click)="closeSidebar()"
          >Sobre nosotros</a
        >
      </li>
      <li class="mb-2">
        <a class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]" [routerLink]="['/mashup']" (click)="closeSidebar()">Mapa</a>
      </li>
      <li class="mb-2">
        <a class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]" [routerLink]="['/loans']" (click)="closeSidebar()"
          >Préstamos</a
        >
      </li>
      <li class="mb-2"><a class="block p-2 no-underline text-[#333333] rounded-sm hover:bg-[#f5f5f5]" href="#">Cerrar sesión</a></li>
    </ul>
  </nav>
</div>

<!-- Overlay -->
<div class="fixed top-0 left-0 w-full h-full bg-black/30 z-999" [class]="{ block: sidebarOpen, hidden: !sidebarOpen }" (click)="closeSidebar()"></div>
