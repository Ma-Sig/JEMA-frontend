<div class="table-container">
    <div class="table-controls">
      <div class="search-container">
        <div class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input type="text" [(ngModel)]="searchQuery" (input)="currentPage = 1" class="search-input" placeholder="Buscar...">
      </div>
      <button class="filter-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        Filtrar
      </button>
    </div>
  
    <table>
      <thead>
        <tr>
          <th class="id-column">ID</th>
          <th class="lugar-column">LUGAR</th>
          <th class="servicio-column">SERVICIO</th>
          <th class="cantidad-column">CANTIDAD</th>
          <th class="fecha-column">FECHA</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of paginatedData">
          <td>{{ item.id }}</td>
          <td>{{ item.lugar }}</td>
          <td>{{ item.servicio }}</td>
          <td>{{ item.cantidad }}</td>
          <td>{{ item.fecha }}</td>
        </tr>
      </tbody>
    </table>
  
    <div class="pagination">
      <div class="pagination-info">{{ paginationInfo }}</div>
      <button class="pagination-button" (click)="prevPage()" [disabled]="currentPage === 1">
        <svg width="16" height="16" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
  
      <button *ngFor="let page of [].constructor(totalPages); let i = index"
              class="pagination-button"
              [class.active]="currentPage === i + 1"
              (click)="goToPage(i + 1)">
        {{ i + 1 }}
      </button>
  
      <button class="pagination-button" (click)="nextPage()" [disabled]="currentPage === totalPages">
        <svg width="16" height="16" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>
