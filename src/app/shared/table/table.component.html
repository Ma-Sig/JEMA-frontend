<div class="bg-white rounded-lg overflow-hidden shadow-sm p-10">
  <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100 w-full">
    <div class="w-full">
      <input
        type="text"
        class="w-full px-4 py-2.5 pl-10 border border-gray-200 rounded-md text-sm transition-colors focus:outline-none focus:border-gray-400"
        [(ngModel)]="searchQuery"
        (input)="currentPage = 1"
        placeholder="Buscar..."
      />
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full border-collapse">
      <thead class="bg-white border-b border-gray-100">
        <tr>
          <th *ngIf="showActions == true" class="text-left w-20 px-5 py-4 font-semibold text-sm text-gray-700 uppercase tracking-wider">Acción</th>
          <th *ngFor="let col of columns" class="px-5 py-4 text-left font-semibold text-sm text-gray-700 uppercase tracking-wider">
            {{ col.label }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let row of paginatedData; let i = index"
          [class]="i % 2 === 0 ? 'bg-white hover:bg-gray-50' : 'bg-gray-50 hover:bg-gray-100'"
          class="transition-colors"
        >
          <td *ngIf="showActions == true" class="px-5 py-4 text-sm text-gray-700 border-b border-gray-100 last:border-b-0">
            <div class="flex gap-2">
              <button *ngIf="actions.view == true" class="text-blue-600 hover:underline text-sm" (click)="onView(row)">Ver</button>
              <button *ngIf="actions.edit == true" class="text-green-600 hover:underline text-sm" (click)="onEdit(row)">Editar</button>
              <button *ngIf="actions.delete == true" class="text-red-600 hover:underline text-sm" (click)="onDelete(row)">Eliminar</button>
            </div>
          </td>

          <td *ngFor="let col of columns" class="px-5 py-4 text-sm text-gray-700 border-b border-gray-100 last:border-b-0">
            <ng-container *ngIf="col.type === 'date'; else normalText">
              {{ row[col.key] | date : 'dd/MM/yyyy' }}
            </ng-container>
            <ng-template #normalText>
              {{ row[col.key] }}
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-end items-center px-5 py-4 border-t border-gray-100">
    <span class="mr-auto text-sm text-gray-600">{{ paginationInfo }}</span>
    <div class="flex items-center space-x-1">
      <button
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        class="w-9 h-9 rounded border-none flex items-center justify-center cursor-pointer text-gray-700 transition-colors hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        «
      </button>
      <button
        *ngFor="let p of [].constructor(totalPages); let i = index"
        [class]="currentPage === i + 1 ? 'bg-gray-200 font-semibold' : 'hover:bg-gray-100'"
        class="w-9 h-9 rounded border-none flex items-center justify-center cursor-pointer mx-0.5 text-gray-700 transition-colors"
        (click)="goToPage(i + 1)"
      >
        {{ i + 1 }}
      </button>
      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        class="w-9 h-9 rounded border-none flex items-center justify-center cursor-pointer text-gray-700 transition-colors hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        »
      </button>
    </div>
  </div>
</div>
